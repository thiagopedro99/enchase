name = "enchase-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false
routes = [{ pattern = "enchase.othiagosilva.com.br/api/*", zone_name = "othiagosilva.com.br" }]

[vars]
GITHUB_APP_ID = "5926239"
GITHUB_CLIENT_ID = ""

[[kv_namespaces]]
binding = "SESSIONS"

[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60
