name: Browser tests

on:
  pull_request:
    paths-ignore:
      - Dockerfile
      - .dockerignore
      - nginx.conf
      - .snyk
      - .github/dependabot.yml
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/site.yml
      - CONTRIBUTING.md
      - CLAUDE.md
      - skill.md
      - demo/**
      - worker/**
      - src/tests/demo/**
      - src/tests/worker/**
      - tsconfig.worker.json
  push:
    branches: [dev]
    paths-ignore:
      - Dockerfile
      - .dockerignore
      - nginx.conf
      - .snyk
      - .github/dependabot.yml
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/site.yml
      - CONTRIBUTING.md
      - CLAUDE.md
      - skill.md
      - demo/**
      - worker/**
      - src/tests/demo/**
      - src/tests/worker/**
      - tsconfig.worker.json
  workflow_call:

concurrency:
  group: browser-tests-${{ github.ref_name == 'main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --ipc=host
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            experimental: false
          - browser: firefox
            experimental: false
          - browser: webkit
            experimental: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/runBrowserTests.mjs ${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures-${{ matrix.browser }}
          path: .vitest/failures
          if-no-files-found: ignore
