name: Browser tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  browser:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            experimental: false
          - browser: firefox
            experimental: false
          - browser: webkit
            experimental: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node scripts/runBrowserTests.mjs ${{ matrix.browser }}
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-failures-${{ matrix.browser }}
          path: .vitest/failures
          if-no-files-found: ignore
