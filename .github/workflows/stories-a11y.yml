name: Stories accessibility

on:
  pull_request:
    paths:
      - 'src/components/**'
      - 'src/hooks/**'
      - 'src/utils/**'
      - 'src/styles/**'
      - 'src/docs/**'
      - 'lib/**'
      - 'scripts/auditStories.mjs'
      - '.github/workflows/stories-a11y.yml'
  push:
    branches: [dev]
    paths:
      - 'src/components/**'
      - 'src/hooks/**'
      - 'src/utils/**'
      - 'src/styles/**'
      - 'src/docs/**'
      - 'lib/**'
      - 'scripts/auditStories.mjs'
      - '.github/workflows/stories-a11y.yml'

concurrency:
  group: stories-a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: ${{ matrix.style }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --ipc=host
    strategy:
      fail-fast: false
      matrix:
        style: [enchase, material2, material3, shadcn, workbench]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - run: npm run test:stories-a11y -- --combo=light:${{ matrix.style }}
      - run: npm run test:stories-a11y -- --combo=dark:${{ matrix.style }}
        if: success() || failure()
