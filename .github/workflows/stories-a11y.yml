name: Stories accessibility

on:
  pull_request:
    paths:
      - 'src/components/**'
      - 'src/hooks/**'
      - 'src/utils/**'
      - 'src/styles/**'
      - 'src/docs/**'
      - 'lib/**'
      - 'scripts/auditStories.mjs'
      - '.github/workflows/stories-a11y.yml'
  push:
    branches: [dev]
    paths:
      - 'src/components/**'
      - 'src/hooks/**'
      - 'src/utils/**'
      - 'src/styles/**'
      - 'src/docs/**'
      - 'lib/**'
      - 'scripts/auditStories.mjs'
      - '.github/workflows/stories-a11y.yml'

concurrency:
  group: stories-a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - run: npm run test:stories-a11y
