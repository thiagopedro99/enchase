name: package

on:
  push:
    branches: [dev]
    paths-ignore:
      - Dockerfile
      - .dockerignore
      - nginx.conf
      - .snyk
      - .github/dependabot.yml
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/site.yml
      - demo/**
      - worker/**
      - src/tests/demo/**
      - src/tests/worker/**
      - tsconfig.worker.json
  pull_request:
    paths-ignore:
      - Dockerfile
      - .dockerignore
      - nginx.conf
      - .snyk
      - .github/dependabot.yml
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/site.yml
      - demo/**
      - worker/**
      - src/tests/demo/**
      - src/tests/worker/**
      - tsconfig.worker.json
  workflow_call:

concurrency:
  group: package-${{ github.ref_name == 'main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run docs:api:check
      - run: npm run test
      - run: npm run build:lib
      - run: npm run check:api
      - run: npm run pack:check
      - run: npm run test:consumer
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:next
      - run: npm run test:eject
      - run: npm run test:size
