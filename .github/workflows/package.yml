name: package

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_call:

concurrency:
  group: package-${{ github.ref_name == 'main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run docs:api:check
      - run: npm run test
      - run: npm run build:lib
      - run: npm run pack:check
      - run: npm run test:consumer
      - run: npm run test:next
      - run: npm run test:size
