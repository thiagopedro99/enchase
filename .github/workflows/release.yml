name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  decide:
    if: github.repository == 'thiagopedro99/enchase'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      action: ${{ steps.decide.outputs.action }}
      tested: ${{ steps.tested.outputs.tested }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      prerelease: ${{ steps.decide.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: decide
        run: node scripts/release.mjs check
      - id: tested
        if: steps.decide.outputs.action == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$1/runs?head_sha=$GITHUB_SHA&branch=dev&event=push&status=success&per_page=1" --jq '.total_count' || echo 0
          }
          if [ "$(passed package.yml)" -gt 0 ] && [ "$(passed browser-tests.yml)" -gt 0 ]; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
          else
            echo "tested=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    needs: decide
    if: needs.decide.outputs.action == 'publish' && needs.decide.outputs.tested != 'true'
    uses: ./.github/workflows/package.yml

  browsers:
    needs: decide
    if: needs.decide.outputs.action == 'publish' && needs.decide.outputs.tested != 'true'
    uses: ./.github/workflows/browser-tests.yml

  publish:
    needs: [decide, package, browsers]
    if: ${{ !cancelled() && needs.decide.result == 'success' && ((needs.decide.outputs.action == 'publish' && needs.decide.outputs.tested != 'true' && needs.package.result == 'success' && needs.browsers.result == 'success') || (needs.decide.outputs.action == 'publish' && needs.decide.outputs.tested == 'true' && needs.package.result == 'skipped' && needs.browsers.result == 'skipped') || (needs.decide.outputs.action == 'tag' && needs.package.result == 'skipped' && needs.browsers.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.decide.outputs.version }}
      DIST_TAG: ${{ needs.decide.outputs.tag }}
      PRERELEASE: ${{ needs.decide.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        if: needs.decide.outputs.action == 'publish'
        run: |
          npm install --global npm@11
          npm ci
      - name: Publish to npm
        if: needs.decide.outputs.action == 'publish'
        run: npm publish --provenance --access public --tag "$DIST_TAG"
      - name: Tag and release
        run: |
          node scripts/release.mjs notes "$VERSION" > notes.md
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "the release v$VERSION already exists"
          elif [ "$PRERELEASE" = "true" ]; then
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md --prerelease
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
          fi
