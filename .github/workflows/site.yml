name: site

on:
  push:
    branches: [dev]
    paths:
      - demo/**
      - worker/**
      - src/tests/demo/**
      - src/tests/worker/**
      - tsconfig.worker.json
      - .github/workflows/site.yml
  pull_request:
    paths:
      - demo/**
      - worker/**
      - src/tests/demo/**
      - src/tests/worker/**
      - tsconfig.worker.json
      - .github/workflows/site.yml

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx vitest run src/tests/demo src/tests/worker
